<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>五子棋</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a4d2a 0%, #0e2a1a 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; }
        .game-container { background: #d4af6a; border-radius: 48px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); padding: 15px 18px 22px; width: 100%; max-width: 600px; }
        .board-wrapper { background: #e9c891; border-radius: 20px; padding: 10px; }
        canvas { display: block; margin: 0 auto; cursor: pointer; background-color: #f7efcf; border-radius: 12px; width: 100%; height: auto; aspect-ratio: 1 / 1; }
        .info-panel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; background: #2e241ecc; backdrop-filter: blur(4px); border-radius: 60px; padding: 8px 16px; }
        .turn-indicator { background: #1f1912; border-radius: 40px; padding: 6px 14px; display: flex; align-items: center; gap: 8px; }
        .piece-sample { width: 28px; height: 28px; border-radius: 50%; }
        .piece-black { background: radial-gradient(circle at 35% 35%, #555, #1e1e1e); }
        .piece-white { background: radial-gradient(circle at 35% 35%, #f9f9fc, #e1e5ec); }
        .turn-text { font-size: 1rem; font-weight: bold; color: #f7e9b0; }
        .reset-btn { background: #ffcd7e; border: none; font-size: 0.9rem; font-weight: bold; padding: 6px 18px; border-radius: 40px; cursor: pointer; color: #2c1c0c; box-shadow: 0 3px 0 #a05e1a; }
        .reset-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a05e1a; }
        .winner-message { font-size: 0.8rem; background: #000000aa; padding: 5px 12px; border-radius: 40px; color: #ffeaac; }
        .fun-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
        .fun-btn { background: #3a2a1c; border: none; color: #ffecb3; font-size: 0.75rem; padding: 6px 12px; border-radius: 40px; cursor: pointer; }
        .room-info { background: #1f1912aa; border-radius: 20px; padding: 6px 12px; margin-top: 10px; font-size: 0.7rem; color: #ffecb3; text-align: center; word-break: break-all; }
        .debug-log { background: #000000aa; border-radius: 12px; padding: 8px; margin-top: 12px; font-size: 0.65rem; color: #88ff88; font-family: monospace; max-height: 120px; overflow-y: auto; }
        .error-log { color: #ff8888; }
        .start-btn { background: #5a3a2a; font-size: 0.9rem; padding: 10px 20px; display: block; width: 90%; margin: 5px auto; }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="board-wrapper">
            <canvas id="gobangCanvas" width="580" height="580"></canvas>
        </div>
        <div class="info-panel">
            <div class="turn-indicator" id="turnIndicator">
                <div class="piece-sample piece-black" id="turnPieceIcon"></div>
                <div class="turn-text" id="turnText">未连接</div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 新一局</button>
            <div class="winner-message" id="winnerMsg"></div>
        </div>
        
        <div class="fun-bar">
            <button class="fun-btn" id="shakeBtn">🌀 震屏</button>
            <button class="fun-btn" id="rainbowBtn">🌈 彩虹</button>
            <button class="fun-btn" id="ghostBtn">👻 幽灵</button>
            <button class="fun-btn" id="bigHeadBtn">🐼 大头</button>
            <button class="fun-btn" id="reverseBtn">🔄 镜像</button>
            <button class="fun-btn" id="confettiBtn">🎉 烟花</button>
            <button class="fun-btn" id="darkBtn">🌙 暗夜</button>
            <button class="fun-btn" id="echoBtn">🗣️ 语音</button>
        </div>
        
        <div class="room-info" id="roomInfo">⚡ 点击下方按钮开始</div>
        <div class="debug-log" id="debugLog">📋 调试日志<br></div>
    </div>
</div>

<script>
    (function(){
        // ========== 你的 API 密钥 ==========
        const JSONBIN_API_KEY = '$2a$10$rwXAaM.JCg0ZlUMzkSoDouQyP0WjbtYK3TGVP43oqtnqzesY3DIIS';
        
        function addLog(msg, isError = false) {
            const logDiv = document.getElementById('debugLog');
            const time = new Date().toLocaleTimeString();
            const colorClass = isError ? 'error-log' : '';
            logDiv.innerHTML += `<div class="${colorClass}">[${time}] ${msg}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }
        
        // 测试 API 密钥是否有效
        async function testAPIKey() {
            addLog("🔍 正在测试 API 密钥...");
            try {
                const response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY
                    },
                    body: JSON.stringify({ test: "hello", type: "test" })
                });
                
                const data = await response.json();
                addLog(`📡 响应状态: ${response.status}`);
                
                if (response.ok && data.metadata && data.metadata.id) {
                    addLog(`✅ API 密钥有效！测试创建成功，ID: ${data.metadata.id.substring(0, 20)}...`);
                    // 删除测试用的 bin
                    await fetch(`https://api.jsonbin.io/v3/b/${data.metadata.id}`, {
                        method: 'DELETE',
                        headers: { 'X-Master-Key': JSONBIN_API_KEY }
                    });
                    addLog(`🗑️ 已删除测试 bin`);
                    return true;
                } else {
                    addLog(`❌ API 密钥无效！响应: ${JSON.stringify(data)}`, true);
                    return false;
                }
            } catch (e) {
                addLog(`❌ 网络错误: ${e.message}`, true);
                return false;
            }
        }
        
        // 创建房间
        async function createGame(roomName) {
            addLog(`🏗️ 创建房间: ${roomName}`);
            const emptyBoard = Array(15).fill().map(() => Array(15).fill(0));
            const gameData = {
                room_name: roomName,
                board_data: emptyBoard,
                current_player: 1,
                winner: null,
                created_at: new Date().toISOString()
            };
            
            try {
                const response = await fetch('https://api.jsonbin.io/v3/b', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_API_KEY,
                        'X-Bin-Private': 'false'
                    },
                    body: JSON.stringify(gameData)
                });
                
                const data = await response.json();
                addLog(`📡 创建响应状态: ${response.status}`);
                
                if (response.ok && data.metadata && data.metadata.id) {
                    addLog(`✅ 房间创建成功！Bin ID: ${data.metadata.id}`);
                    return data.metadata.id;
                } else {
                    addLog(`❌ 创建失败: ${JSON.stringify(data)}`, true);
                    return null;
                }
            } catch (e) {
                addLog(`❌ 创建异常: ${e.message}`, true);
                return null;
            }
        }
        
        // 开始联机
        async function startOnline() {
            addLog("🚀 开始联机流程...");
            
            // 先测试 API 密钥
            const isValid = await testAPIKey();
            if (!isValid) {
                addLog("⚠️ API 密钥测试失败，请检查密钥是否正确", true);
                alert("API 密钥无效！请检查你的 X-Master-Key 是否正确复制。\n\n注意：需要完整复制，不要有多余空格。");
                return;
            }
            
            let action = prompt("选择操作:\n1 - 创建新房间\n2 - 加入已有房间\n\n输入1或2", "1");
            
            if (action === "1") {
                let newRoomName = prompt("请输入房间名称:", "我的五子棋房间");
                if (!newRoomName) return;
                
                const newBinId = await createGame(newRoomName);
                if (newBinId) {
                    alert(`✨ 房间创建成功！\n\n房间ID: ${newBinId}\n\n请把这个ID复制给你的朋友！`);
                    document.getElementById('roomInfo').innerHTML = `🏠 房间: ${newRoomName}<br>🔑 房间ID: ${newBinId}<br>⚫ 你是黑棋(先手)`;
                } else {
                    alert("创建房间失败，请查看调试日志");
                }
            } 
            else if (action === "2") {
                let inputBinId = prompt("请输入房间ID:");
                if (!inputBinId) return;
                alert(`尝试加入房间: ${inputBinId}\n请查看调试日志`);
                addLog(`📝 尝试加入房间: ${inputBinId}`);
            }
        }
        
        // 页面加载时自动测试
        window.onload = () => {
            addLog("🎮 五子棋联机版加载完成");
            addLog(`🔑 API密钥前20位: ${JSONBIN_API_KEY.substring(0, 20)}...`);
            testAPIKey();
        };
        
        // 绑定开始按钮
        const startBtn = document.createElement('button');
        startBtn.innerText = '🎮 开始联机 / 加入房间';
        startBtn.className = 'fun-btn start-btn';
        startBtn.onclick = startOnline;
        document.querySelector('.game-container').insertBefore(startBtn, document.querySelector('.board-wrapper'));
        
        // 其他功能按钮（简化版）
        document.getElementById('shakeBtn')?.addEventListener('click', () => { if(navigator.vibrate) navigator.vibrate(50); });
        document.getElementById('rainbowBtn')?.addEventListener('click', () => alert("彩虹模式已开启"));
        document.getElementById('confettiBtn')?.addEventListener('click', () => alert("烟花特效"));
        document.getElementById('darkBtn')?.addEventListener('click', () => alert("暗夜模式"));
        document.getElementById('echoBtn')?.addEventListener('click', () => alert("语音功能"));
        
        // Canvas 基础绘制
        const canvas = document.getElementById('gobangCanvas');
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#f7efcf';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#4b3a2b';
        for(let i=0;i<15;i++){
            ctx.beginPath();
            ctx.moveTo(28, 28 + i * 37.4);
            ctx.lineTo(552, 28 + i * 37.4);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(28 + i * 37.4, 28);
            ctx.lineTo(28 + i * 37.4, 552);
            ctx.stroke();
        }
    })();
</script>
</body>
</html>
