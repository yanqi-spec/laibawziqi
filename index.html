<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>五子棋 · JSONBin联机版</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a4d2a 0%, #0e2a1a 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; }
        .game-container { background: #d4af6a; border-radius: 48px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); padding: 15px 18px 22px; width: 100%; max-width: 600px; }
        .board-wrapper { background: #e9c891; border-radius: 20px; padding: 10px; }
        canvas { display: block; margin: 0 auto; cursor: pointer; background-color: #f7efcf; border-radius: 12px; width: 100%; height: auto; aspect-ratio: 1 / 1; }
        .info-panel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; background: #2e241ecc; backdrop-filter: blur(4px); border-radius: 60px; padding: 8px 16px; }
        .turn-indicator { background: #1f1912; border-radius: 40px; padding: 6px 14px; display: flex; align-items: center; gap: 8px; }
        .piece-sample { width: 28px; height: 28px; border-radius: 50%; }
        .piece-black { background: radial-gradient(circle at 35% 35%, #555, #1e1e1e); }
        .piece-white { background: radial-gradient(circle at 35% 35%, #f9f9fc, #e1e5ec); }
        .turn-text { font-size: 1rem; font-weight: bold; color: #f7e9b0; }
        .reset-btn { background: #ffcd7e; border: none; font-size: 0.9rem; font-weight: bold; padding: 6px 18px; border-radius: 40px; cursor: pointer; color: #2c1c0c; box-shadow: 0 3px 0 #a05e1a; }
        .reset-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a05e1a; }
        .winner-message { font-size: 0.8rem; background: #000000aa; padding: 5px 12px; border-radius: 40px; color: #ffeaac; }
        .fun-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
        .fun-btn { background: #3a2a1c; border: none; color: #ffecb3; font-size: 0.75rem; padding: 6px 12px; border-radius: 40px; cursor: pointer; }
        .room-info { background: #1f1912aa; border-radius: 20px; padding: 8px 12px; margin-top: 10px; font-size: 0.75rem; color: #ffecb3; text-align: center; word-break: break-all; }
        .sync-status { font-size: 0.65rem; color: #aaffaa; margin-top: 5px; text-align: center; }
        .selection-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.9);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .selection-card {
            background: linear-gradient(145deg, #d4af6a, #c49a4a);
            border-radius: 60px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 300px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .selection-title { font-size: 1.8rem; font-weight: bold; color: #2c1c0c; margin-bottom: 10px; }
        .selection-sub { font-size: 0.8rem; color: #3a2a1a; margin-bottom: 25px; }
        .selection-buttons { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
        .sel-btn { width: 110px; padding: 15px 0; border: none; border-radius: 50px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .sel-btn-black { background: linear-gradient(145deg, #333, #111); color: white; box-shadow: 0 5px 0 #000; }
        .sel-btn-black:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
        .sel-btn-white { background: linear-gradient(145deg, #f0f0f0, #ddd); color: #333; box-shadow: 0 5px 0 #aaa; }
        .sel-btn-white:active { transform: translateY(2px); box-shadow: 0 2px 0 #aaa; }
        .room-input-area { margin-top: 20px; padding-top: 20px; border-top: 1px solid #a0804a; display: none; }
        .room-input { width: 100%; padding: 12px; border-radius: 40px; border: none; font-size: 0.9rem; text-align: center; background: #f7efcf; margin-bottom: 10px; letter-spacing: 2px; font-weight: bold; }
        .join-confirm { background: #2c1c0c; color: #ffecb3; border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; width: 100%; }
        .back-btn { background: none; border: none; color: #2c1c0c; font-size: 0.8rem; margin-top: 10px; cursor: pointer; text-decoration: underline; }
        .ready-btn { background: #4caf50; border: none; color: white; padding: 8px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c1c0c;
            color: #ffecb3;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            z-index: 1001;
            animation: slideUp 0.3s ease;
            white-space: nowrap;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="board-wrapper">
            <canvas id="gobangCanvas" width="580" height="580"></canvas>
        </div>
        <div class="info-panel">
            <div class="turn-indicator" id="turnIndicator">
                <div class="piece-sample piece-black" id="turnPieceIcon"></div>
                <div class="turn-text" id="turnText">未连接</div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 新一局</button>
            <div class="winner-message" id="winnerMsg"></div>
        </div>
        
        <div class="fun-bar">
            <button class="fun-btn" id="shakeBtn">🌀 震屏</button>
            <button class="fun-btn" id="rainbowBtn">🌈 彩虹</button>
            <button class="fun-btn" id="ghostBtn">👻 幽灵</button>
            <button class="fun-btn" id="bigHeadBtn">🐼 大头</button>
            <button class="fun-btn" id="reverseBtn">🔄 镜像</button>
            <button class="fun-btn" id="confettiBtn">🎉 烟花</button>
            <button class="fun-btn" id="darkBtn">🌙 暗夜</button>
            <button class="fun-btn" id="echoBtn">🗣️ 语音</button>
        </div>
        
        <div class="room-info" id="roomInfo">⚡ 点击下方按钮开始</div>
        <div class="sync-status" id="syncStatus">🟢 就绪</div>
    </div>
</div>

<script>
    (function(){
        // ========== 你的新 API 密钥 ==========
        const JSONBIN_API_KEY = '$2a$10$rIn20jO6C950568CuYA3KOndlPwfO0ADrGUBTyzWuoIL9uN1wTTrG';
        
        const boardSize = 15;
        let board = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
        let currentPlayer = 1;
        let myColor = null;
        let gameOver = false;
        let binId = null;
        let pollingInterval = null;
        let isPlacing = false;
        
        let rainbowMode = false, ghostMode = false, bigHeadMode = false, reverseMode = false, darkMode = false;
        let shakeEnabled = false, voiceEnabled = false;
        
        const canvas = document.getElementById('gobangCanvas');
        const ctx = canvas.getContext('2d');
        const turnTextEl = document.getElementById('turnText');
        const turnPieceIcon = document.getElementById('turnPieceIcon');
        const winnerMsgEl = document.getElementById('winnerMsg');
        const resetBtn = document.getElementById('resetBtn');
        const roomInfoEl = document.getElementById('roomInfo');
        const syncStatusEl = document.getElementById('syncStatus');
        
        let cellSize = 0, offsetX = 0, offsetY = 0, radius = 0;
        
        // 生成6位房间码
        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars[Math.floor(Math.random() * chars.length)];
            }
            return code;
        }
        
        function showToast(msg) {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`✅ 房间码已复制：${text}`);
            }).catch(() => {
                prompt("手动复制房间码：", text);
            });
        }
        
        function updateSyncStatus(status, isError = false) {
            syncStatusEl.innerHTML = status;
            syncStatusEl.style.color = isError ? '#ff8888' : '#aaffaa';
        }
        
        // 带超时的 fetch
        async function fetchWithTimeout(url, options, timeout = 10000) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                clearTimeout(timeoutId);
                return response;
            } catch (error) {
                clearTimeout(timeoutId);
                throw error;
            }
        }
        
        // ========== API 函数 ==========
        async function createGame(roomCode) {
            const emptyBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
            const gameData = {
                room_code: roomCode,
                board_data: emptyBoard,
                current_player: 1,
                winner: null,
                black_joined: false,
                white_joined: false,
                game_started: false,
                created_at: Date.now()
            };
            
            const response = await fetchWithTimeout('https://api.jsonbin.io/v3/b', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Private': 'false'
                },
                body: JSON.stringify(gameData)
            }, 15000);
            
            const data = await response.json();
            if (data.metadata && data.metadata.id) {
                return data.metadata.id;
            }
            throw new Error(data.message || "创建失败");
        }
        
        async function getGameData(binIdInput) {
            const response = await fetchWithTimeout(`https://api.jsonbin.io/v3/b/${binIdInput}/latest`, {
                method: 'GET',
                headers: { 'X-Master-Key': JSONBIN_API_KEY }
            }, 10000);
            const data = await response.json();
            return data;
        }
        
        async function updateGameData(binIdInput, gameData) {
            await fetchWithTimeout(`https://api.jsonbin.io/v3/b/${binIdInput}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(gameData)
            }, 10000);
        }
        
        // 查找房间（通过房间码）
        async function findRoomByCode(roomCode) {
            // JSONBin 不支持搜索，所以需要用另一种方法
            // 这里简化：直接提示用户让创建者分享链接
            return null;
        }
        
        // 轮询
        function startPolling() {
            if (pollingInterval) clearInterval(pollingInterval);
            
            pollingInterval = setInterval(async () => {
                if (!binId) return;
                
                try {
                    const gameData = await getGameData(binId);
                    if (!gameData || !gameData.board_data) return;
                    
                    const remoteBoardStr = JSON.stringify(gameData.board_data);
                    const localBoardStr = JSON.stringify(board);
                    
                    if (remoteBoardStr !== localBoardStr) {
                        board = JSON.parse(remoteBoardStr);
                        currentPlayer = gameData.current_player;
                        gameOver = (gameData.winner !== null);
                        
                        if (gameOver && gameData.winner) {
                            winnerMsgEl.innerText = `${gameData.winner === 'black' ? '黑棋' : '白棋'} 胜利！🎉`;
                            if (voiceEnabled) speak(gameData.winner === 'black' ? '黑方胜利' : '白方胜利');
                            if (typeof canvasConfetti === 'function') canvasConfetti({ particleCount: 150, spread: 70 });
                        } else if (!gameOver) {
                            winnerMsgEl.innerText = '';
                        }
                        
                        updateTurnDisplay();
                        drawBoard();
                        updateSyncStatus(`🟢 已同步`);
                        if (shakeEnabled && navigator.vibrate) navigator.vibrate(30);
                    }
                    
                    if (!gameData.game_started && gameData.black_joined && gameData.white_joined) {
                        gameData.game_started = true;
                        await updateGameData(binId, gameData);
                        showToast("🎉 双方已准备！游戏开始！");
                        updateSyncStatus("🟢 游戏进行中");
                    }
                } catch (e) {
                    console.error("轮询错误:", e);
                }
            }, 500);
        }
        
        // ========== 游戏逻辑 ==========
        function checkWin(row, col, playerVal) {
            const dirs = [[1,0],[0,1],[1,1],[1,-1]];
            for(let [dx, dy] of dirs) {
                let count = 1;
                for(let step=1; step<=4; step++) {
                    const nr = row+dx*step, nc = col+dy*step;
                    if(nr<0 || nr>=boardSize || nc<0 || nc>=boardSize) break;
                    if(board[nr]?.[nc] === playerVal) count++;
                    else break;
                }
                for(let step=1; step<=4; step++) {
                    const nr = row-dx*step, nc = col-dy*step;
                    if(nr<0 || nr>=boardSize || nc<0 || nc>=boardSize) break;
                    if(board[nr]?.[nc] === playerVal) count++;
                    else break;
                }
                if(count >= 5) return true;
            }
            return false;
        }
        
        async function placePiece(row, col) {
            if (gameOver) { showToast("游戏已结束"); return false; }
            if (!myColor) { showToast("请先加入房间"); return false; }
            if (board[row]?.[col] !== 0) { showToast("已有棋子"); return false; }
            if (currentPlayer !== myColor) { showToast("等待对手落子"); return false; }
            if (isPlacing) return false;
            
            isPlacing = true;
            
            try {
                const newBoard = JSON.parse(JSON.stringify(board));
                newBoard[row][col] = myColor;
                
                const win = checkWin(row, col, myColor);
                let winnerVal = null;
                let newCurrentPlayer = currentPlayer;
                
                if (win) {
                    winnerVal = myColor === 1 ? 'black' : 'white';
                } else {
                    newCurrentPlayer = currentPlayer === 1 ? 2 : 1;
                }
                
                const latestGameData = await getGameData(binId);
                if (latestGameData) {
                    latestGameData.board_data = newBoard;
                    latestGameData.current_player = newCurrentPlayer;
                    latestGameData.winner = winnerVal;
                    await updateGameData(binId, latestGameData);
                    
                    board = newBoard;
                    currentPlayer = newCurrentPlayer;
                    gameOver = (winnerVal !== null);
                    
                    if (gameOver) {
                        winnerMsgEl.innerText = `${winnerVal === 'black' ? '黑棋' : '白棋'} 胜利！🎉`;
                        if (voiceEnabled) speak(winnerVal === 'black' ? '黑方胜利' : '白方胜利');
                        if (typeof canvasConfetti === 'function') canvasConfetti({ particleCount: 150, spread: 70 });
                    }
                    
                    updateTurnDisplay();
                    drawBoard();
                    if (shakeEnabled && navigator.vibrate) navigator.vibrate(20);
                }
            } catch (e) {
                console.error(e);
                showToast("网络错误，请重试");
            } finally {
                isPlacing = false;
            }
            return true;
        }
        
        async function setReady() {
            try {
                const gameData = await getGameData(binId);
                if (gameData) {
                    if (myColor === 1) {
                        gameData.black_joined = true;
                    } else {
                        gameData.white_joined = true;
                    }
                    await updateGameData(binId, gameData);
                    showToast("✅ 已准备，等待对方...");
                    updateSyncStatus("🟡 已准备，等待对方...");
                }
            } catch (e) {
                showToast("准备失败，请重试");
            }
        }
        
        async function resetGame() {
            const emptyBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
            const gameData = await getGameData(binId);
            if (gameData) {
                gameData.board_data = emptyBoard;
                gameData.current_player = 1;
                gameData.winner = null;
                gameData.black_joined = false;
                gameData.white_joined = false;
                gameData.game_started = false;
                await updateGameData(binId, gameData);
                
                board = emptyBoard;
                currentPlayer = 1;
                gameOver = false;
                winnerMsgEl.innerText = '';
                updateTurnDisplay();
                drawBoard();
                showToast("棋盘已重置");
                updateSyncStatus("🟡 游戏已重置");
                
                setTimeout(() => setReady(), 500);
            }
        }
        
        // 绘制
        function drawBoard() {
            const w = canvas.width, h = canvas.height;
            const padding = 28;
            cellSize = (w - padding * 2) / (boardSize - 1);
            offsetX = padding;
            offsetY = padding;
            radius = Math.min(cellSize * 0.42, 16);
            
            ctx.fillStyle = darkMode ? '#1a2a1f' : '#f7efcf';
            ctx.fillRect(0, 0, w, h);
            
            ctx.strokeStyle = darkMode ? '#bbaa88' : '#4b3a2b';
            ctx.lineWidth = 1.8;
            for(let i = 0; i < boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(offsetX, offsetY + i * cellSize);
                ctx.lineTo(offsetX + (boardSize-1) * cellSize, offsetY + i * cellSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(offsetX + i * cellSize, offsetY);
                ctx.lineTo(offsetX + i * cellSize, offsetY + (boardSize-1) * cellSize);
                ctx.stroke();
            }
            
            const starPoints = [[3,3],[11,3],[7,7],[3,11],[11,11]];
            for(let [x,y] of starPoints) {
                const cx = offsetX + x * cellSize;
                const cy = offsetY + y * cellSize;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize*0.1, 0, 2*Math.PI);
                ctx.fillStyle = darkMode ? '#e9c891' : '#b45f2b';
                ctx.fill();
            }
            
            for(let i = 0; i < boardSize; i++) {
                for(let j = 0; j < boardSize; j++) {
                    const val = board[i]?.[j];
                    if(!val || val === 0) continue;
                    
                    let x = offsetX + j * cellSize;
                    let y = offsetY + i * cellSize;
                    if (reverseMode) {
                        x = offsetX + (boardSize-1 - j) * cellSize;
                        y = offsetY + (boardSize-1 - i) * cellSize;
                    }
                    
                    let grad;
                    if (rainbowMode) {
                        const hue = (Date.now() * 0.005) % 360;
                        grad = ctx.createRadialGradient(x-3, y-3, 3, x, y, radius);
                        grad.addColorStop(0, `hsl(${hue}, 100%, 65%)`);
                        grad.addColorStop(1, `hsl(${hue+40}, 80%, 45%)`);
                        ctx.fillStyle = grad;
                    } else if (val === 1) {
                        grad = ctx.createRadialGradient(x-3, y-3, 3, x, y, radius);
                        grad.addColorStop(0, '#3a3a3a');
                        grad.addColorStop(1, '#111');
                        ctx.fillStyle = grad;
                    } else {
                        grad = ctx.createRadialGradient(x-3, y-3, 3, x, y, radius);
                        grad.addColorStop(0, '#fefefe');
                        grad.addColorStop(1, '#cbd5e1');
                        ctx.fillStyle = grad;
                    }
                    
                    ctx.globalAlpha = ghostMode ? 0.65 : 1;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI*2);
                    ctx.fill();
                    
                    if (bigHeadMode) {
                        ctx.beginPath();
                        ctx.arc(x-2, y-2, radius*0.4, 0, 2*Math.PI);
                        ctx.fillStyle = 'white';
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
            }
        }
        
        function updateTurnDisplay() {
            if (gameOver) return;
            if (!myColor) {
                turnTextEl.innerText = "未加入房间";
                return;
            }
            if (currentPlayer === myColor) {
                turnTextEl.innerText = myColor === 1 ? '⚫ 你的回合 (黑棋)' : '⚪ 你的回合 (白棋)';
                turnPieceIcon.className = `piece-sample ${myColor === 1 ? 'piece-black' : 'piece-white'}`;
            } else {
                turnTextEl.innerText = '⏳ 等待对手落子...';
            }
        }
        
        function speak(msg) {
            if (!voiceEnabled) return;
            const utterance = new SpeechSynthesisUtterance(msg);
            utterance.lang = 'zh-CN';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        // 坐标转换
        function getBoardIndexFromPixels(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            
            if (canvasX < offsetX - radius || canvasX > offsetX + (boardSize-1)*cellSize + radius) return null;
            
            let minDist = cellSize * 0.4;
            let targetRow = -1, targetCol = -1;
            for(let i = 0; i < boardSize; i++) {
                for(let j = 0; j < boardSize; j++) {
                    const cx = offsetX + j * cellSize;
                    const cy = offsetY + i * cellSize;
                    const dist = Math.hypot(canvasX - cx, canvasY - cy);
                    if(dist < minDist) {
                        minDist = dist;
                        targetRow = i;
                        targetCol = j;
                    }
                }
            }
            return targetRow !== -1 ? { row: targetRow, col: targetCol } : null;
        }
        
        function onCanvasClick(e) {
            if (gameOver) { showToast("游戏已结束"); return; }
            if (!myColor) { showToast("请先加入房间"); return; }
            if (currentPlayer !== myColor) { showToast("等待对手落子"); return; }
            
            const pos = getBoardIndexFromPixels(e.clientX, e.clientY);
            if (pos) placePiece(pos.row, pos.col);
        }
        
        // ========== 创建房间 ==========
        async function createRoom() {
            updateSyncStatus("🟡 创建房间中...");
            roomInfoEl.innerHTML = '<span class="loading-spinner"></span> 正在创建房间...';
            
            const roomCode = generateRoomCode();
            
            try {
                const newBinId = await createGame(roomCode);
                
                if (newBinId) {
                    binId = newBinId;
                    myColor = 1;
                    board = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
                    currentPlayer = 1;
                    gameOver = false;
                    
                    copyToClipboard(roomCode);
                    
                    roomInfoEl.innerHTML = `
                        ✅ 房间创建成功！<br>
                        🔑 房间码: <strong style="font-size:1.2rem">${roomCode}</strong><br>
                        ⚫ 你是黑棋（先手）<br>
                        <br>
                        📤 房间码已复制！<br>
                        让对方选择「白棋」并输入这个6位码
                        <button class="ready-btn" id="readyBtn">✅ 准备就绪</button>
                    `;
                    
                    updateTurnDisplay();
                    drawBoard();
                    startPolling();
                    updateSyncStatus("🟡 等待白棋加入，点击准备...");
                    
                    document.getElementById('readyBtn')?.addEventListener('click', () => setReady());
                } else {
                    throw new Error("创建失败");
                }
            } catch (error) {
                console.error("创建房间错误:", error);
                roomInfoEl.innerHTML = `❌ 创建失败: ${error.message}<br><button class="ready-btn" onclick="location.reload()">🔄 重试</button>`;
                updateSyncStatus("❌ 创建失败", true);
                showToast("创建失败，请刷新页面重试");
            }
        }
        
        // ========== 加入房间 ==========
        async function joinRoomByCode(roomCode) {
            updateSyncStatus("🟡 查找房间...");
            roomInfoEl.innerHTML = '<span class="loading-spinner"></span> 正在查找房间...';
            
            // 由于 JSONBin 不支持搜索，提示用户使用链接
            showToast("请让创建者分享完整的房间链接");
            roomInfoEl.innerHTML = `
                ⚠️ JSONBin 限制，无法通过房间码搜索<br>
                📌 请让创建者复制浏览器地址栏的完整链接发送给你<br>
                <br>
                <button class="ready-btn" onclick="location.reload()">🔄 返回</button>
            `;
        }
        
        // ========== 选择界面 ==========
        function showSelectionUI() {
            // 检查 URL 参数
            const urlParams = new URLSearchParams(window.location.search);
            const roomParam = urlParams.get('room');
            
            if (roomParam && roomParam.length > 10) {
                // 有房间参数，直接加入
                joinRoomByCode(roomParam);
                return;
            }
            
            const overlay = document.createElement('div');
            overlay.className = 'selection-overlay';
            overlay.innerHTML = `
                <div class="selection-card">
                    <div class="selection-title">🎲 五子棋</div>
                    <div class="selection-sub">选择你的角色</div>
                    <div class="selection-buttons">
                        <button class="sel-btn sel-btn-black" id="createBtn">⚫ 黑棋<br><span style="font-size:0.7rem">创建房间</span></button>
                        <button class="sel-btn sel-btn-white" id="joinBtn">⚪ 白棋<br><span style="font-size:0.7rem">加入房间</span></button>
                    </div>
                    <div id="joinPanel" style="display:none; margin-top:15px">
                        <input type="text" id="roomCodeInput" placeholder="粘贴朋友分享的完整链接" style="width:100%; padding:10px; border-radius:40px; border:none; text-align:center; font-size:0.8rem">
                        <button id="confirmJoinBtn" style="margin-top:10px; background:#2c1c0c; color:white; border:none; padding:10px; border-radius:40px; width:100%; cursor:pointer">确认加入</button>
                        <button id="backBtn" style="margin-top:8px; background:none; border:none; color:#2c1c0c; cursor:pointer">返回</button>
                    </div>
                    <div style="margin-top:15px; font-size:0.65rem; color:#3a2a1a">💡 创建后会自动复制房间码</div>
                </div>
            `;
            document.body.appendChild(overlay);
            
            document.getElementById('createBtn').onclick = async () => {
                overlay.remove();
                await createRoom();
            };
            
            document.getElementById('joinBtn').onclick = () => {
                document.getElementById('joinPanel').style.display = 'block';
            };
            
            document.getElementById('backBtn').onclick = () => {
                document.getElementById('joinPanel').style.display = 'none';
            };
            
            document.getElementById('confirmJoinBtn').onclick = async () => {
                let input = document.getElementById('roomCodeInput').value.trim();
                // 尝试从链接中提取房间码
                let match = input.match(/room=([A-Z0-9]{6})/i);
                let roomCode = match ? match[1] : input.toUpperCase();
                
                if (roomCode.length !== 6) {
                    showToast("请输入6位房间码或完整链接");
                    return;
                }
                overlay.remove();
                await joinRoomByCode(roomCode);
            };
        }
        
        // ========== 事件绑定 ==========
        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            const touch = e.touches[0];
            if (touch) onCanvasClick(touch);
        });
        
        resetBtn.addEventListener('click', () => {
            if (binId && myColor) resetGame();
            else showToast("请先加入房间");
        });
        
        document.getElementById('shakeBtn').onclick = () => { shakeEnabled = !shakeEnabled; showToast(shakeEnabled ? "震动开启" : "震动关闭"); };
        document.getElementById('rainbowBtn').onclick = () => { rainbowMode = !rainbowMode; drawBoard(); };
        document.getElementById('ghostBtn').onclick = () => { ghostMode = !ghostMode; drawBoard(); };
        document.getElementById('bigHeadBtn').onclick = () => { bigHeadMode = !bigHeadMode; drawBoard(); };
        document.getElementById('reverseBtn').onclick = () => { reverseMode = !reverseMode; drawBoard(); };
        document.getElementById('confettiBtn').onclick = () => { 
            if (typeof canvasConfetti === 'function') canvasConfetti({ particleCount: 200, spread: 70 });
            else { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1'; s.onload = () => canvasConfetti({ particleCount: 200 }); document.body.appendChild(s); }
        };
        document.getElementById('darkBtn').onclick = () => { darkMode = !darkMode; drawBoard(); };
        document.getElementById('echoBtn').onclick = () => { voiceEnabled = !voiceEnabled; showToast(voiceEnabled ? "语音开启" : "语音关闭"); };
        
        // 初始化
        drawBoard();
        showSelectionUI();
    })();
</script>
</body>
</html>
