<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>五子棋 · 实时联机版</title>
    <style>
        * { user-select: none; -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { background: linear-gradient(145deg, #1a4d2a 0%, #0e2a1a 100%); min-height: 100vh; display: flex; justify-content: center; align-items: center; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 12px; }
        .game-container { background: #d4af6a; border-radius: 48px; box-shadow: 0 20px 35px rgba(0,0,0,0.5); padding: 15px 18px 22px; width: 100%; max-width: 600px; }
        .board-wrapper { background: #e9c891; border-radius: 20px; padding: 10px; }
        canvas { display: block; margin: 0 auto; cursor: pointer; background-color: #f7efcf; border-radius: 12px; width: 100%; height: auto; aspect-ratio: 1 / 1; }
        .info-panel { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-top: 18px; gap: 12px; background: #2e241ecc; backdrop-filter: blur(4px); border-radius: 60px; padding: 8px 16px; }
        .turn-indicator { background: #1f1912; border-radius: 40px; padding: 6px 14px; display: flex; align-items: center; gap: 8px; }
        .piece-sample { width: 28px; height: 28px; border-radius: 50%; }
        .piece-black { background: radial-gradient(circle at 35% 35%, #555, #1e1e1e); }
        .piece-white { background: radial-gradient(circle at 35% 35%, #f9f9fc, #e1e5ec); }
        .turn-text { font-size: 1rem; font-weight: bold; color: #f7e9b0; }
        .reset-btn { background: #ffcd7e; border: none; font-size: 0.9rem; font-weight: bold; padding: 6px 18px; border-radius: 40px; cursor: pointer; color: #2c1c0c; box-shadow: 0 3px 0 #a05e1a; }
        .reset-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #a05e1a; }
        .winner-message { font-size: 0.8rem; background: #000000aa; padding: 5px 12px; border-radius: 40px; color: #ffeaac; }
        .fun-bar { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 16px; }
        .fun-btn { background: #3a2a1c; border: none; color: #ffecb3; font-size: 0.75rem; padding: 6px 12px; border-radius: 40px; cursor: pointer; }
        .room-info { background: #1f1912aa; border-radius: 20px; padding: 8px 12px; margin-top: 10px; font-size: 0.75rem; color: #ffecb3; text-align: center; word-break: break-all; }
        .sync-status { font-size: 0.65rem; color: #aaffaa; margin-top: 5px; text-align: center; }
        
        /* 选择界面样式 */
        .selection-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            font-family: 'Segoe UI', sans-serif;
        }
        .selection-card {
            background: linear-gradient(145deg, #d4af6a, #c49a4a);
            border-radius: 60px;
            padding: 30px 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            width: 280px;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .selection-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: #2c1c0c;
            margin-bottom: 10px;
        }
        .selection-sub {
            font-size: 0.8rem;
            color: #3a2a1a;
            margin-bottom: 25px;
        }
        .selection-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .sel-btn {
            width: 110px;
            padding: 15px 0;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .sel-btn-black {
            background: linear-gradient(145deg, #333, #111);
            color: white;
            box-shadow: 0 5px 0 #000;
        }
        .sel-btn-black:active { transform: translateY(2px); box-shadow: 0 2px 0 #000; }
        .sel-btn-white {
            background: linear-gradient(145deg, #f0f0f0, #ddd);
            color: #333;
            box-shadow: 0 5px 0 #aaa;
        }
        .sel-btn-white:active { transform: translateY(2px); box-shadow: 0 2px 0 #aaa; }
        .room-input-area {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #a0804a;
        }
        .room-input {
            width: 100%;
            padding: 12px;
            border-radius: 40px;
            border: none;
            font-size: 0.8rem;
            text-align: center;
            background: #f7efcf;
            margin-bottom: 10px;
        }
        .join-confirm {
            background: #2c1c0c;
            color: #ffecb3;
            border: none;
            padding: 10px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
        }
        .close-btn {
            background: none;
            border: none;
            color: #2c1c0c;
            font-size: 1.5rem;
            position: absolute;
            top: 15px;
            right: 20px;
            cursor: pointer;
        }
        
        /* 弹窗 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #2c1c0c;
            color: #ffecb3;
            padding: 12px 24px;
            border-radius: 50px;
            font-size: 0.9rem;
            z-index: 1001;
            animation: slideUp 0.3s ease;
            white-space: nowrap;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateX(-50%) translateY(30px); }
            to { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
        
        .hidden { display: none; }
    </style>
</head>
<body>
<div>
    <div class="game-container">
        <div class="board-wrapper">
            <canvas id="gobangCanvas" width="580" height="580"></canvas>
        </div>
        <div class="info-panel">
            <div class="turn-indicator" id="turnIndicator">
                <div class="piece-sample piece-black" id="turnPieceIcon"></div>
                <div class="turn-text" id="turnText">未连接</div>
            </div>
            <button class="reset-btn" id="resetBtn">🔄 新一局</button>
            <div class="winner-message" id="winnerMsg"></div>
        </div>
        
        <div class="fun-bar">
            <button class="fun-btn" id="shakeBtn">🌀 震屏</button>
            <button class="fun-btn" id="rainbowBtn">🌈 彩虹</button>
            <button class="fun-btn" id="ghostBtn">👻 幽灵</button>
            <button class="fun-btn" id="bigHeadBtn">🐼 大头</button>
            <button class="fun-btn" id="reverseBtn">🔄 镜像</button>
            <button class="fun-btn" id="confettiBtn">🎉 烟花</button>
            <button class="fun-btn" id="darkBtn">🌙 暗夜</button>
            <button class="fun-btn" id="echoBtn">🗣️ 语音</button>
        </div>
        
        <div class="room-info" id="roomInfo">⚡ 点击下方按钮开始</div>
        <div class="sync-status" id="syncStatus">🟢 等待连接...</div>
    </div>
</div>

<script>
    (function(){
        // ========== API 密钥 ==========
        const JSONBIN_API_KEY = '$2a$10$rwXAaM.JCg0ZlUMzkSoDouQyP0WjbtYK3TGVP43oqtnqzesY3DIIS';
        
        // ========== 游戏状态 ==========
        const boardSize = 15;
        let board = [];
        let currentPlayer = 1;
        let myColor = null;
        let gameOver = false;
        let binId = null;
        let pollingInterval = null;
        let isPlacing = false;
        let opponentReady = false;
        
        // 趣味开关
        let rainbowMode = false, ghostMode = false, bigHeadMode = false, reverseMode = false, darkMode = false;
        let shakeEnabled = false, voiceEnabled = false;
        
        // DOM 元素
        const canvas = document.getElementById('gobangCanvas');
        const ctx = canvas.getContext('2d');
        const turnTextEl = document.getElementById('turnText');
        const turnPieceIcon = document.getElementById('turnPieceIcon');
        const winnerMsgEl = document.getElementById('winnerMsg');
        const resetBtn = document.getElementById('resetBtn');
        const roomInfoEl = document.getElementById('roomInfo');
        const syncStatusEl = document.getElementById('syncStatus');
        
        let cellSize = 0, offsetX = 0, offsetY = 0, radius = 0;
        
        // 生成短ID (6位)
        function generateShortId() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = '';
            for (let i = 0; i < 6; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            return result;
        }
        
        // 显示弹窗
        function showToast(msg, duration = 2000) {
            const existingToast = document.querySelector('.toast');
            if (existingToast) existingToast.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), duration);
        }
        
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`✅ 房间码已复制：${text}`);
            }).catch(() => {
                prompt("手动复制房间码：", text);
            });
        }
        
        function updateSyncStatus(status, isError = false) {
            syncStatusEl.innerHTML = status;
            syncStatusEl.style.color = isError ? '#ff8888' : '#aaffaa';
        }
        
        // ========== JSONBin 核心函数（使用短ID作为binId）==========
        async function createGame(roomName, shortId) {
            const emptyBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
            const gameData = {
                room_name: roomName,
                board_data: emptyBoard,
                current_player: 1,
                winner: null,
                short_id: shortId,
                black_ready: false,
                white_ready: false,
                game_started: false,
                created_at: Date.now(),
                last_update: Date.now()
            };
            
            const response = await fetch('https://api.jsonbin.io/v3/b', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY,
                    'X-Bin-Private': 'false'
                },
                body: JSON.stringify(gameData)
            });
            const data = await response.json();
            if (data.metadata && data.metadata.id) {
                return data.metadata.id;
            }
            return null;
        }
        
        async function getGameData(binIdInput) {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${binIdInput}/latest`, {
                    method: 'GET',
                    headers: { 
                        'X-Master-Key': JSONBIN_API_KEY,
                        'X-Bin-Meta': 'false'
                    }
                });
                const data = await response.json();
                return data;
            } catch (e) {
                return null;
            }
        }
        
        async function updateGameData(binIdInput, gameData) {
            gameData.last_update = Date.now();
            await fetch(`https://api.jsonbin.io/v3/b/${binIdInput}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Master-Key': JSONBIN_API_KEY
                },
                body: JSON.stringify(gameData)
            });
        }
        
        // 快速轮询 (150ms)
        function startPolling(binIdInput) {
            if (pollingInterval) clearInterval(pollingInterval);
            
            pollingInterval = setInterval(async () => {
                if (!binIdInput || isPlacing) return;
                
                const gameData = await getGameData(binIdInput);
                if (!gameData || !gameData.board_data) return;
                
                // 检查棋盘变化
                const remoteBoardStr = JSON.stringify(gameData.board_data);
                const localBoardStr = JSON.stringify(board);
                
                if (remoteBoardStr !== localBoardStr) {
                    console.log("检测到远程更新");
                    board = JSON.parse(remoteBoardStr);
                    currentPlayer = gameData.current_player;
                    gameOver = (gameData.winner !== null);
                    
                    if (gameOver && gameData.winner) {
                        winnerMsgEl.innerText = `${gameData.winner === 'black' ? '黑棋' : '白棋'} 胜利！🎉`;
                        if (voiceEnabled) speak(gameData.winner === 'black' ? '黑方胜利' : '白方胜利');
                        if (typeof canvasConfetti === 'function') canvasConfetti({ particleCount: 150, spread: 70 });
                        showToast(gameData.winner === 'black' ? '黑棋胜利！' : '白棋胜利！');
                    } else if (!gameOver) {
                        winnerMsgEl.innerText = '';
                    }
                    
                    updateTurnDisplay();
                    drawBoard();
                    updateSyncStatus(`🟢 已同步 (${new Date().toLocaleTimeString()})`);
                    
                    if (shakeEnabled && navigator.vibrate) navigator.vibrate(50);
                }
                
                // 检查游戏开始状态
                if (!gameData.game_started && gameData.black_ready && gameData.white_ready) {
                    gameData.game_started = true;
                    await updateGameData(binIdInput, gameData);
                    showToast("🎉 双方已准备！游戏开始！黑棋先下 🎉");
                    updateSyncStatus("🟢 游戏进行中");
                }
            }, 150);
        }
        
        // ========== 游戏逻辑 ==========
        function checkWin(row, col, playerVal) {
            const dirs = [[1,0],[0,1],[1,1],[1,-1]];
            for(let [dx, dy] of dirs) {
                let count = 1;
                for(let step=1; step<=4; step++) {
                    const nr = row+dx*step, nc = col+dy*step;
                    if(nr<0 || nr>=boardSize || nc<0 || nc>=boardSize) break;
                    if(board[nr][nc] === playerVal) count++;
                    else break;
                }
                for(let step=1; step<=4; step++) {
                    const nr = row-dx*step, nc = col-dy*step;
                    if(nr<0 || nr>=boardSize || nc<0 || nc>=boardSize) break;
                    if(board[nr][nc] === playerVal) count++;
                    else break;
                }
                if(count >= 5) return true;
            }
            return false;
        }
        
        async function placePiece(row, col) {
            if (gameOver) {
                showToast("游戏已结束，请点击「新一局」");
                return false;
            }
            if (!myColor) {
                showToast("请先加入房间");
                return false;
            }
            if (board[row][col] !== 0) {
                showToast("这里已经有棋子了");
                return false;
            }
            if (currentPlayer !== myColor) {
                showToast("请等待对手落子");
                return false;
            }
            if (isPlacing) return false;
            
            isPlacing = true;
            updateSyncStatus("🟡 正在落子...");
            
            try {
                const newBoard = JSON.parse(JSON.stringify(board));
                newBoard[row][col] = myColor;
                
                const win = checkWin(row, col, myColor);
                let winnerVal = null;
                let newCurrentPlayer = currentPlayer;
                
                if (win) {
                    winnerVal = myColor === 1 ? 'black' : 'white';
                } else {
                    newCurrentPlayer = currentPlayer === 1 ? 2 : 1;
                }
                
                const latestGameData = await getGameData(binId);
                if (latestGameData && latestGameData.board_data) {
                    latestGameData.board_data = newBoard;
                    latestGameData.current_player = newCurrentPlayer;
                    latestGameData.winner = winnerVal;
                    await updateGameData(binId, latestGameData);
                    
                    board = newBoard;
                    currentPlayer = newCurrentPlayer;
                    gameOver = (winnerVal !== null);
                    
                    if (gameOver) {
                        winnerMsgEl.innerText = `${winnerVal === 'black' ? '黑棋' : '白棋'} 胜利！🎉`;
                        if (voiceEnabled) speak(winnerVal === 'black' ? '黑方胜利' : '白方胜利');
                        if (typeof canvasConfetti === 'function') canvasConfetti({ particleCount: 150, spread: 70 });
                        showToast(winnerVal === 'black' ? '黑棋胜利！' : '白棋胜利！');
                    }
                    
                    updateTurnDisplay();
                    drawBoard();
                    if (shakeEnabled && navigator.vibrate) navigator.vibrate(20);
                    updateSyncStatus(`✅ 落子成功`);
                }
            } catch (e) {
                console.error("落子失败:", e);
                updateSyncStatus("❌ 同步失败", true);
                showToast("网络错误，请重试");
            } finally {
                isPlacing = false;
            }
            return true;
        }
        
        async function setReady() {
            const gameData = await getGameData(binId);
            if (gameData) {
                if (myColor === 1) {
                    gameData.black_ready = true;
                } else {
                    gameData.white_ready = true;
                }
                await updateGameData(binId, gameData);
                showToast("✅ 已准备，等待对方...");
                updateSyncStatus("🟡 已准备，等待对方...");
                
                // 检查双方是否都准备好了
                const updatedData = await getGameData(binId);
                if (updatedData.black_ready && updatedData.white_ready && !updatedData.game_started) {
                    updatedData.game_started = true;
                    await updateGameData(binId, updatedData);
                    showToast("🎉 双方已准备！游戏开始！黑棋先下 🎉");
                    updateSyncStatus("🟢 游戏进行中");
                }
            }
        }
        
        async function resetGame() {
            if (!binId) return;
            
            const emptyBoard = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
            const gameData = await getGameData(binId);
            if (gameData) {
                gameData.board_data = emptyBoard;
                gameData.current_player = 1;
                gameData.winner = null;
                gameData.black_ready = false;
                gameData.white_ready = false;
                gameData.game_started = false;
                await updateGameData(binId, gameData);
                
                board = emptyBoard;
                currentPlayer = 1;
                gameOver = false;
                winnerMsgEl.innerText = '';
                updateTurnDisplay();
                drawBoard();
                showToast("棋盘已重置，请重新准备");
                updateSyncStatus("🟡 游戏已重置，请点击准备");
                
                // 重新准备
                setTimeout(() => setReady(), 500);
            }
        }
        
        // ========== 绘制 ==========
        function drawBoard() {
            const w = canvas.width, h = canvas.height;
            const padding = 28;
            cellSize = (w - padding * 2) / (boardSize - 1);
            offsetX = padding;
            offsetY = padding;
            radius = Math.min(cellSize * 0.42, 16);
            
            ctx.fillStyle = darkMode ? '#1a2a1f' : '#f7efcf';
            ctx.fillRect(0, 0, w, h);
            
            ctx.strokeStyle = darkMode ? '#bbaa88' : '#4b3a2b';
            ctx.lineWidth = 1.8;
            for(let i = 0; i < boardSize; i++) {
                ctx.beginPath();
                ctx.moveTo(offsetX, offsetY + i * cellSize);
                ctx.lineTo(offsetX + (boardSize-1) * cellSize, offsetY + i * cellSize);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(offsetX + i * cellSize, offsetY);
                ctx.lineTo(offsetX + i * cellSize, offsetY + (boardSize-1) * cellSize);
                ctx.stroke();
            }
            
            const starPoints = [[3,3],[11,3],[7,7],[3,11],[11,11]];
            for(let [x,y] of starPoints) {
                const cx = offsetX + x * cellSize;
                const cy = offsetY + y * cellSize;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize*0.1, 0, 2*Math.PI);
                ctx.fillStyle = darkMode ? '#e9c891' : '#b45f2b';
                ctx.fill();
            }
            
            for(let i = 0; i < boardSize; i++) {
                for(let j = 0; j < boardSize; j++) {
                    if(board[i][j] === 0) continue;
                    
                    let x = offsetX + j * cellSize;
                    let y = offsetY + i * cellSize;
                    if (reverseMode) {
                        x = offsetX + (boardSize-1 - j) * cellSize;
                        y = offsetY + (boardSize-1 - i) * cellSize;
                    }
                    
                    let grad;
                    if (rainbowMode) {
                        const hue = (Date.now() * 0.005) % 360;
                        grad = ctx.createRadialGradient(x-3, y-3, 3, x, y, radius);
                        grad.addColorStop(0, `hsl(${hue}, 100%, 65%)`);
                        grad.addColorStop(1, `hsl(${hue+40}, 80%, 45%)`);
                        ctx.fillStyle = grad;
                    } else if (board[i][j] === 1) {
                        grad = ctx.createRadialGradient(x-3, y-3, 3, x, y, radius);
                        grad.addColorStop(0, '#3a3a3a');
                        grad.addColorStop(1, '#111');
                        ctx.fillStyle = grad;
                    } else {
                        grad = ctx.createRadialGradient(x-3, y-3, 3, x, y, radius);
                        grad.addColorStop(0, '#fefefe');
                        grad.addColorStop(1, '#cbd5e1');
                        ctx.fillStyle = grad;
                    }
                    
                    ctx.globalAlpha = ghostMode ? 0.65 : 1;
                    ctx.beginPath();
                    ctx.arc(x, y, radius, 0, Math.PI*2);
                    ctx.fill();
                    
                    if (bigHeadMode) {
                        ctx.beginPath();
                        ctx.arc(x-2, y-2, radius*0.4, 0, 2*Math.PI);
                        ctx.fillStyle = 'white';
                        ctx.fill();
                    }
                    ctx.globalAlpha = 1;
                }
            }
        }
        
        function updateTurnDisplay() {
            if (gameOver) return;
            if (!myColor) {
                turnTextEl.innerText = "未加入房间";
                return;
            }
            
            if (currentPlayer === myColor) {
                turnTextEl.innerText = myColor === 1 ? '⚫ 你的回合 (黑棋)' : '⚪ 你的回合 (白棋)';
                turnPieceIcon.className = `piece-sample ${myColor === 1 ? 'piece-black' : 'piece-white'}`;
            } else {
                turnTextEl.innerText = '⏳ 等待对手落子...';
            }
        }
        
        function speak(msg) {
            if (!voiceEnabled) return;
            const utterance = new SpeechSynthesisUtterance(msg);
            utterance.lang = 'zh-CN';
            window.speechSynthesis.cancel();
            window.speechSynthesis.speak(utterance);
        }
        
        // ========== 坐标转换 ==========
        function getBoardIndexFromPixels(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            let canvasX = (clientX - rect.left) * scaleX;
            let canvasY = (clientY - rect.top) * scaleY;
            
            if (canvasX < offsetX - radius || canvasX > offsetX + (boardSize-1)*cellSize + radius) return null;
            
            let minDist = cellSize * 0.4;
            let targetRow = -1, targetCol = -1;
            for(let i = 0; i < boardSize; i++) {
                for(let j = 0; j < boardSize; j++) {
                    const cx = offsetX + j * cellSize;
                    const cy = offsetY + i * cellSize;
                    const dist = Math.hypot(canvasX - cx, canvasY - cy);
                    if(dist < minDist) {
                        minDist = dist;
                        targetRow = i;
                        targetCol = j;
                    }
                }
            }
            return targetRow !== -1 ? { row: targetRow, col: targetCol } : null;
        }
        
        function onCanvasClick(e) {
            if (gameOver) {
                showToast("游戏已结束，请点击「新一局」");
                return;
            }
            if (!myColor) {
                showToast("请先加入房间");
                return;
            }
            if (currentPlayer !== myColor) {
                showToast("请等待对手落子");
                return;
            }
            if (isPlacing) return;
            
            const pos = getBoardIndexFromPixels(e.clientX, e.clientY);
            if (pos) {
                placePiece(pos.row, pos.col);
            }
        }
        
        // ========== 选择界面 ==========
        function showSelectionUI() {
            const overlay = document.createElement('div');
            overlay.className = 'selection-overlay';
            overlay.innerHTML = `
                <div class="selection-card">
                    <div class="selection-title">🎲 五子棋</div>
                    <div class="selection-sub">选择你的角色</div>
                    <div class="selection-buttons">
                        <button class="sel-btn sel-btn-black" id="createBlackBtn">⚫ 黑棋<br><span style="font-size:0.7rem">创建房间</span></button>
                        <button class="sel-btn sel-btn-white" id="joinWhiteBtn">⚪ 白棋<br><span style="font-size:0.7rem">加入房间</span></button>
                    </div>
                    <div class="room-input-area" id="joinArea" style="display:none">
                        <input type="text" class="room-input" id="roomCodeInput" placeholder="输入6位房间码" maxlength="6">
                        <button class="join-confirm" id="confirmJoinBtn">🔍 加入房间</button>
                    </div>
                </div>
            `;
            document.body.appendChild(overlay);
            
            const createBtn = document.getElementById('createBlackBtn');
            const joinBtn = document.getElementById('joinWhiteBtn');
            const joinArea = document.getElementById('joinArea');
            const confirmJoin = document.getElementById('confirmJoinBtn');
            const roomCodeInput = document.getElementById('roomCodeInput');
            
            createBtn.onclick = async () => {
                overlay.remove();
                await createRoom();
            };
            
            joinBtn.onclick = () => {
                joinArea.style.display = 'block';
            };
            
            confirmJoin.onclick = async () => {
                const code = roomCodeInput.value.trim().toUpperCase();
                if (code.length !== 6) {
                    showToast("请输入6位房间码");
                    return;
                }
                overlay.remove();
                await joinRoom(code);
            };
        }
        
        async function createRoom() {
            const shortId = generateShortId();
            const roomName = `房间${shortId}`;
            
            roomInfoEl.innerHTML = "⏳ 正在创建房间...";
            updateSyncStatus("🟡 创建房间中...");
            
            const newBinId = await createGame(roomName, shortId);
            if (newBinId) {
                binId = newBinId;
                myColor = 1;
                board = Array(boardSize).fill().map(() => Array(boardSize).fill(0));
                currentPlayer = 1;
                gameOver = false;
                
                // 保存短ID和binId的映射到localStorage
                localStorage.setItem(`room_${shortId}`, newBinId);
                
                copyToClipboard(shortId);
                
                roomInfoEl.innerHTML = `
                    ✅ 房间创建成功！<br>
                    🔑 房间码: <strong style="font-size:1.2rem">${shortId}</strong><br>
                    ⚫ 你是黑棋（先手）<br>
                    <br>
                    📤 房间码已自动复制！<br>
                    让对方选择「白棋」并输入这个6位码
                    <button class="copy-btn" onclick="navigator.clipboard.writeText('${shortId}')">📋 再次复制</button>
                `;
                
                updateTurnDisplay();
                drawBoard();
                startPolling(binId);
                updateSyncStatus("🟡 等待白棋加入...");
                
                // 等待对方加入后自动准备
                const checkInterval = setInterval(async () => {
                    const gameData = await getGameData(binId);
                    if (gameData && gameData.white_ready) {
                        clearInterval(checkInterval);
                        showToast("🎉 白棋已加入！游戏开始！");
                        updateSyncStatus("🟢 游戏进行中");
                    }
                }, 1000);
            } else {
                roomInfoEl.innerHTML = "❌ 创建失败，请刷新重试";
                updateSyncStatus("❌ 创建失败", true);
                showToast("创建失败，请刷新页面");
            }
        }
        
        async function joinRoom(shortId) {
            // 从localStorage查找binId
            let foundBinId = localStorage.getItem(`room_${shortId}`);
            
            if (!foundBinId) {
                // 如果没有，尝试通过API查找（这里简化：直接提示错误）
                roomInfoEl.innerHTML = `❌ 房间码 "${shortId}" 不存在<br>请检查后重试`;
                updateSyncStatus("❌ 房间不存在", true);
                showToast("房间码无效，请检查后重试");
                return;
            }
            
            const gameData = await getGameData(foundBinId);
            if (gameData && gameData.board_data) {
                binId = foundBinId;
                myColor = 2;
                board = JSON.parse(JSON.stringify(gameData.board_data));
                currentPlayer = gameData.current_player;
                gameOver = (gameData.winner !== null);
                
                roomInfoEl.innerHTML = `
                    ✅ 加入成功！<br>
                    🔑 房间码: ${shortId}<br>
                    ⚪ 你是白棋（后手）<br>
                    <br>
                    ${gameData.winner ? '⚠️ 游戏已结束，点击「新一局」开始' : '等待黑棋落子...'}
                `;
                
                if (gameData.winner) {
                    winnerMsgEl.innerText = `${gameData.winner === 'black' ? '黑棋' : '白棋'} 已获胜`;
                }
                
                showToast(`✅ 加入成功！你是白棋`);
                updateTurnDisplay();
                drawBoard();
                startPolling(binId);
                updateSyncStatus("🟢 已加入房间，等待黑棋");
                
                // 自动准备
                setTimeout(() => setReady(), 500);
            } else {
                roomInfoEl.innerHTML = `❌ 加入失败！<br>房间码 "${shortId}" 无效`;
                updateSyncStatus("❌ 加入失败", true);
                showToast("加入失败，请检查房间码");
            }
        }
        
        // ========== 事件绑定 ==========
        canvas.addEventListener('click', onCanvasClick);
        canvas.addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            const touch = e.touches[0];
            if (touch) onCanvasClick(touch);
        });
        
        resetBtn.addEventListener('click', () => {
            if (binId && myColor) {
                resetGame();
            } else {
                showToast("请先加入房间");
            }
        });
        
        // 趣味按钮
        document.getElementById('shakeBtn').onclick = () => { shakeEnabled = !shakeEnabled; showToast(shakeEnabled ? "震动开启 ✓" : "震动关闭"); };
        document.getElementById('rainbowBtn').onclick = () => { rainbowMode = !rainbowMode; drawBoard(); };
        document.getElementById('ghostBtn').onclick = () => { ghostMode = !ghostMode; drawBoard(); };
        document.getElementById('bigHeadBtn').onclick = () => { bigHeadMode = !bigHeadMode; drawBoard(); };
        document.getElementById('reverseBtn').onclick = () => { reverseMode = !reverseMode; drawBoard(); };
        document.getElementById('confettiBtn').onclick = () => { 
            if (typeof canvasConfetti === 'function') {
                canvasConfetti({ particleCount: 200, spread: 70, origin: { y: 0.6 } });
            } else {
                const script = document.createElement('script');
                script.src = 'https://cdn.jsdelivr.net/npm/canvas-confetti@1';
                script.onload = () => canvasConfetti({ particleCount: 200, spread: 70 });
                document.body.appendChild(script);
            }
        };
        document.getElementById('darkBtn').onclick = () => { darkMode = !darkMode; drawBoard(); };
        document.getElementById('echoBtn').onclick = () => { voiceEnabled = !voiceEnabled; showToast(voiceEnabled ? "语音播报开启 ✓" : "语音播报关闭"); };
        
        // 初始化
        drawBoard();
        showSelectionUI();
    })();
</script>
</body>
</html>
